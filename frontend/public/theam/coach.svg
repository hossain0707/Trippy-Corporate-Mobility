<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 540" role="img" aria-labelledby="title desc">
<title id="title">TRIPPY corporate coach illustration</title>
<desc id="desc">White long-distance coach with dark windows and emerald green TRIPPY branding.</desc>
<defs>
 <linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fdffff"/><stop offset=".46" stop-color="#f0faf4"/><stop offset=".74" stop-color="#bcd6c6"/><stop offset="1" stop-color="#426966"/></linearGradient>
 <linearGradient id="glass" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#143039"/><stop offset=".37" stop-color="#285c64"/><stop offset=".54" stop-color="#091c27"/><stop offset="1" stop-color="#102c35"/></linearGradient>
 <linearGradient id="front" x1="0" y1="0" x2="1" y2=".8"><stop stop-color="#1d4c56"/><stop offset=".55" stop-color="#071920"/><stop offset="1" stop-color="#163f46"/></linearGradient>
 <linearGradient id="emerald" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1bf2b0"/><stop offset=".5" stop-color="#12af7a"/><stop offset="1" stop-color="#04744f"/></linearGradient>
 <linearGradient id="windows" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#59a4a5"/><stop offset=".43" stop-color="#12343e"/><stop offset="1" stop-color="#071b24"/></linearGradient>
 <linearGradient id="wheel" x1="0" y1="0" x2=".5" y2="1"><stop stop-color="#1c3e3e"/><stop offset=".5" stop-color="#050f16"/><stop offset="1" stop-color="#1b3138"/></linearGradient>
 <filter id="drop" x="-30%" y="-30%" width="170%" height="190%"><feGaussianBlur stdDeviation="14"/></filter>
 <filter id="glow"><feGaussianBlur stdDeviation="5"/></filter>
 <pattern id="windowbar" width="77" height="140" patternUnits="userSpaceOnUse"><path d="M75 0V140" stroke="#dffaf1" stroke-width="8" opacity=".33"/></pattern>
</defs>
<ellipse cx="490" cy="463" rx="463" ry="34" fill="#001c22" opacity=".56" filter="url(#drop)"/>
<ellipse cx="490" cy="465" rx="380" ry="13" fill="#06dc99" opacity=".37" filter="url(#glow)"/>
<!-- rear volume and white body -->
<path d="M106 149Q105 125 147 115L763 81Q828 76 865 105L960 202Q980 222 976 263L967 382Q967 407 933 420L206 450Q128 449 105 416Q91 397 92 352Z" fill="url(#body)" stroke="#2b6e67" stroke-width="4"/>
<!-- dark passenger windows -->
<path d="M139 151Q148 139 168 137L755 102Q808 101 830 124L895 211L124 226Z" fill="url(#glass)" stroke="#c5e4da" stroke-width="6"/>
<path d="M135 151Q144 140 170 139L754 108Q788 108 804 122L860 209L124 225Z" fill="url(#windowbar)" opacity=".75"/>
<path d="M152 156L752 125Q785 124 800 142L839 191L147 210Z" fill="url(#windows)" opacity=".4"/>
<path d="M165 156L791 144" fill="none" stroke="#a6eeea" stroke-width="5" opacity=".45"/>
<!-- front windscreen -->
<path d="M842 137L952 222Q971 238 958 320L851 318L842 244Z" fill="url(#front)" stroke="#d6f8ec" stroke-width="7"/>
<path d="M874 165L953 233Q956 258 949 283L862 280L859 205Z" fill="#0d2930" stroke="#58b8ba" stroke-width="3"/>
<path d="M876 180L948 244" stroke="#97e5e4" stroke-width="10" opacity=".28"/>
<!-- front mirror -->
<path d="M946 218L1005 223L1001 233L955 231" fill="none" stroke="#ebfff8" stroke-width="11" stroke-linecap="round"/>
<rect x="985" y="217" width="30" height="22" rx="8" fill="#1b3e44" stroke="#9be9d2" stroke-width="3"/>
<!-- green swoosh -->
<path d="M102 338Q320 353 475 377Q697 398 946 315L955 349Q692 465 405 432L125 405Z" fill="url(#emerald)"/>
<path d="M140 412Q480 488 949 348L948 369Q599 478 193 445Q155 440 140 412Z" fill="#04463f" opacity=".9"/>
<path d="M400 382Q622 414 900 328" fill="none" stroke="#edfff5" stroke-width="9" opacity=".84"/>
<!-- headlights -->
<path d="M889 348L969 331L965 350L913 365Z" fill="#e5ffff" stroke="#83f9da" stroke-width="4"/>
<path d="M890 349L963 336" stroke="#54ffff" stroke-width="6" filter="url(#glow)"/>
<rect x="902" y="381" width="48" height="14" rx="4" fill="#ffcc37"/>
<!-- wheels -->
<g><circle cx="277" cy="444" r="57" fill="#021519"/><circle cx="277" cy="444" r="40" fill="url(#wheel)" stroke="#70949a" stroke-width="5"/><circle cx="277" cy="444" r="22" fill="#678c90" stroke="#c4ebed" stroke-width="5"/><circle cx="277" cy="444" r="9" fill="#254749"/></g>
<g><circle cx="763" cy="424" r="55" fill="#021519"/><circle cx="763" cy="424" r="40" fill="url(#wheel)" stroke="#70949a" stroke-width="5"/><circle cx="763" cy="424" r="22" fill="#688e92" stroke="#d5f5f5" stroke-width="5"/><circle cx="763" cy="424" r="9" fill="#214148"/></g>
<!-- logo -->
<g transform="translate(430 281) skewY(-2)"><rect x="-22" y="-28" width="48" height="50" rx="11" fill="url(#emerald)"/><text x="2" y="11" fill="#fff" font-family="Arial,sans-serif" font-size="42" font-weight="900" text-anchor="middle" font-style="italic">T</text><text x="42" y="-2" fill="#0c3430" font-family="Arial,sans-serif" font-size="46" font-weight="900" font-style="italic">TRIPPY</text><text x="45" y="20" fill="#26564a" font-family="Arial,sans-serif" font-size="18" font-weight="600">Corporate Mobility</text></g>
<path d="M195 240L808 222" stroke="#e5f8eb" stroke-width="6" opacity=".8"/>
<path d="M142 275L150 336" stroke="#789e91" stroke-width="2"/>
<path d="M812 227L822 345" stroke="#789e91" stroke-width="2"/>
</svg>