name: Trippy Corporate checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python-fastapi:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: trippy_test
          POSTGRES_USER: trippy_test
          POSTGRES_PASSWORD: ci_only_not_public
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trippy_test -d trippy_test"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://trippy_test:ci_only_not_public@localhost:5432/trippy_test
      TEST_DATABASE_URL: postgresql://trippy_test:ci_only_not_public@localhost:5432/trippy_test
      APP_ENV: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Apply database migrations
        working-directory: backend
        run: python -m scripts.migrate
      - name: Syntax validation
        run: python -m compileall -q backend/app backend/scripts
      - name: Python tests including competing-seat concurrency
        working-directory: backend
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked direct frontend dependencies
        working-directory: frontend
        run: npm install --no-audit
      - name: Frontend checks and seat map tests
        working-directory: frontend
        run: npm run check && npm test && npm run build
      - name: Capture generated frontend dependency lockfile
        uses: actions/upload-artifact@v4
        with:
          name: trippy-corporate-frontend-lock
          path: frontend/package-lock.json
          retention-days: 1
          if-no-files-found: error
